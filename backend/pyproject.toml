[project]
name = "hunterly"
version = "0.1.0"
description = "Hunterly: personal job-search contact finder (backend + web tracker)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.8.0",
    "fastapi>=0.143.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.30",
]

[project.scripts]
hunterly = "hunterly.cli:main"
hunterly-verifier = "hunterly.verifier_worker:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 110
target-version = "py312"
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
